# .codex/config.base.toml

# AID2E specific Codex settings shared by all MCP server fragments.

sandbox_mode = "workspace-write"
approval_policy = "on-request"

# .codex/mcp_servers/openviking.toml

[mcp_servers.openviking]
type = "streamable_http"
url = "http://localhost:25901/mcp"
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 120
enabled_tools = [
  "openviking_find",
  "openviking_ls",
  "openviking_read",
  "openviking_abstract",
  "openviking_overview",
  "openviking_add_resource",
]

[mcp_servers.openviking.tools.openviking_find]
approval_mode = "approve"

[mcp_servers.openviking.tools.openviking_ls]
approval_mode = "approve"

[mcp_servers.openviking.tools.openviking_read]
approval_mode = "approve"

[mcp_servers.openviking.tools.openviking_abstract]
approval_mode = "approve"

[mcp_servers.openviking.tools.openviking_overview]
approval_mode = "approve"

[mcp_servers.openviking.tools.openviking_add_resource]
approval_mode = "prompt"

# .codex/mcp_servers/swf-testbed.toml

[mcp_servers.swf-testbed]
type = "streamable_http"
url = "https://pandaserver02.sdcc.bnl.gov:8443/swf-monitor/mcp/"
bearer_token_env_var = "SWF_MONITOR_MCP_TOKEN"

[mcp_servers.swf-testbed.tools.panda_get_activity]

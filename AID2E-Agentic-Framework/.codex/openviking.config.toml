# .codex/openviking.config.toml

# AID2E Codex settings for the OpenViking MCP wrapper.
# Source ./openviking-variables.sh before starting Codex, then run Codex with
# this config if your launcher supports alternate config files.

sandbox_mode = "workspace-write"
approval_policy = "on-request"

[mcp_servers.openviking]
type = "streamable_http"
url = "http://localhost:25901/mcp"
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 120
enabled_tools = [
  "openviking_find",
  "openviking_ls",
  "openviking_read",
  "openviking_abstract",
  "openviking_overview",
  "openviking_add_resource",
]

[mcp_servers.openviking.tools.openviking_find]
approval_mode = "approve"

[mcp_servers.openviking.tools.openviking_ls]
approval_mode = "approve"

[mcp_servers.openviking.tools.openviking_read]
approval_mode = "approve"

[mcp_servers.openviking.tools.openviking_abstract]
approval_mode = "approve"

[mcp_servers.openviking.tools.openviking_overview]
approval_mode = "approve"

[mcp_servers.openviking.tools.openviking_add_resource]
approval_mode = "prompt"
